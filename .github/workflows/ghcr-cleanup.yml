name: Monthly GHCR Cleanup
run-name: Monthly container registry cleanup

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 0 1 * *" # Runs at 00:00 on the first day of every month

jobs:
  cleanup-ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          image-names: "book-spider-api book-spider-worker"
          token: ${{ secrets.GITHUB_TOKEN }}
          cut-off: 6M
          keep-n-most-recent: 5
          dry-run: true
